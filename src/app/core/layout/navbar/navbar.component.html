<header class="sticky top-0 z-30 flex h-16 shrink-0 items-center gap-x-4 border-b border-border bg-surface px-4 shadow-sm sm:gap-x-6 sm:px-6 lg:px-8">

  <!-- Sidebar Toggle -->
  <button
    type="button"
    class="-m-2.5 p-2.5 text-text hover:text-primary transition-colors"
    (click)="onToggle()"
  >
    <span class="sr-only">Toggle sidebar</span>
    <ng-icon name="heroBars3" class="text-2xl"></ng-icon>
  </button>

  <!-- Separator -->
  <div class="h-6 w-px bg-border lg:hidden" aria-hidden="true"></div>

  <div class="flex flex-1 gap-x-4 self-stretch lg:gap-x-6">

    <!-- Global Search -->
    <form class="relative flex flex-1 items-center" action="#" method="GET">
      <label for="search-field" class="sr-only">Search</label>
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-2">
        <ng-icon name="heroMagnifyingGlass" class="text-xl text-muted"></ng-icon>
      </div>
      <input
        id="search-field"
        class="block h-full w-full border-0 py-2 pl-10 pr-3 placeholder:text-muted focus:ring-0 sm:text-sm bg-transparent outline-none"
        placeholder="Search inventory, products, orders..."
        type="search"
        name="search"
      />
    </form>

    <!-- Right Section -->
    <div class="flex items-center gap-x-4 lg:gap-x-6">

      <!-- Notifications -->
      <button type="button" class="-m-2.5 p-2.5 text-muted hover:text-primary transition-colors relative">
        <span class="sr-only">View notifications</span>
        <ng-icon name="heroBell" class="text-2xl"></ng-icon>
        <!-- Badge -->
        <span class="absolute top-2 right-2 h-2 w-2 rounded-full bg-danger ring-2 ring-surface"></span>
      </button>

      <!-- Separator -->
      <div class="hidden lg:block lg:h-6 lg:w-px lg:bg-border" aria-hidden="true"></div>

      <!-- Profile dropdown -->
      <div class="relative">
        <button type="button" class="-m-1.5 flex items-center p-1.5 gap-x-3 text-sm font-semibold leading-6 text-heading hover:bg-background rounded-full transition-colors pr-3">
          <span class="sr-only">Open user menu</span>
          <div class="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">
            U
          </div>
          <span class="hidden lg:flex lg:items-center">
            <span class="text-sm font-medium leading-6 text-heading" aria-hidden="true">User</span>
            <ng-icon name="heroChevronDown" class="ml-2 h-5 w-5 text-muted"></ng-icon>
          </span>
        </button>
      </div>

    </div>
  </div>
</header>
