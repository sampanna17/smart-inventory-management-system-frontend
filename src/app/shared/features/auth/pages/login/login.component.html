<div class="min-h-screen bg-slate-50 flex">

  <!-- Left -->
  <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-10">

    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="mb-6">
        <div class="flex items-center gap-3 mb-4">
          <img
            ngSrc="/SIMS_LOGO.png"
            width="1024"
            height="1536"
            alt="SIMS Logo"
            class="w-16 object-contain"
          />

          <div>
            <h1 class="text-2xl font-semibold tracking-tight text-primary">
              SIMS
            </h1>
            <p class="text-sm text-text">
              Smart Inventory Management System
            </p>
          </div>
        </div>

        <h1 class="text-3xl font-bold text-slate-900">
          Welcome Back
        </h1>

        <p class="text-slate-500 mt-2">
          Sign in to continue managing your inventory.
        </p>
      </div>

      <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Email -->

        <div>

          <label
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            Email
          </label>

          <input
            type="email"
            placeholder="Enter your email"
            formControlName="email"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100"
          />

        </div>

        <!-- Password -->

        <div>

          <div class="flex justify-between mb-2">

            <label
              class="text-sm font-medium text-slate-700"
            >
              Password
            </label>

            <a
              class="text-sm text-text hover:text-primary"
            >
              Forgot Password?
            </a>

          </div>

          <div class="relative">
            <input
              [type]="hidePassword() ? 'password' : 'text'"
              placeholder="Enter your password"
              formControlName="password"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100 pr-12"
            />
            <button 
              type="button" 
              (click)="togglePassword()" 
              class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center"
            >
              <ng-icon [name]="hidePassword() ? 'heroEye' : 'heroEyeSlash'" class="text-xl"></ng-icon>
            </button>
          </div>
        </div>

        <!-- Remember -->

        <div class="flex items-center justify-between">

          <label class="flex items-center gap-2">

            <input
              type="checkbox"
              formControlName="rememberMe"
              class="h-4 w-4 rounded border-slate-300 accent-primary"
            >

            <span class="text-sm text-slate-600">
              Remember me
            </span>

          </label>

        </div>

        <!-- Login -->

        <button
          type="submit"
          class="w-full rounded-xl bg-text py-3 font-semibold text-white transition hover:bg-primary-dark"
        >
          Sign In
        </button>

      </form>

      <!-- Divider -->

      <div class="relative my-8">

        <div class="absolute inset-0 flex items-center">

          <div class="w-full border-t border-slate-200"></div>

        </div>

        <div class="relative flex justify-center">

          <span
            class="bg-slate-50 px-4 text-sm text-slate-400"
          >
            OR
          </span>

        </div>

      </div>

      <!-- Google -->

      <button
        class="w-full flex items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white py-3 font-medium text-slate-700 transition hover:bg-slate-100"
      >

        <svg
          class="h-5 w-5"
          viewBox="0 0 48 48"
        >
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.2 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.4-5.2l-6.2-5.2c-2.1 1.6-4.5 2.4-7.2 2.4-5.2 0-9.5-3.3-11.1-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.3 5.5-6.1 7.1l.1-.1 6.2 5.2C35 39.9 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>

        Continue with Google

      </button>

    </div>

  </div>

  <!-- Right -->
  <div
    class="hidden lg:flex w-1/2 bg-text items-center justify-center p-14"
  >

    <img
      ngSrc="/assets/images/login-illustration.png"
      width="1209"
      height="980"
      alt="Login Illustration"
      class="max-w-lg w-full"
    />

  </div>

</div>
