<div class="min-h-screen bg-slate-50 flex">

  <!-- Left (Form Content Projection) -->
  <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md">
      <!-- Logo & Header injected by parent -->
      <ng-content></ng-content>
    </div>
  </div>

  <!-- Right (Illustration) -->
  <div class="hidden lg:flex w-1/2 bg-text items-center justify-center p-14 relative overflow-hidden">
    <div class="absolute inset-0 bg-primary/10"></div>
    <div class="relative z-10 text-center">
      <img
        [ngSrc]="illustrationSrc"
        width="1209"
        height="980"
        alt="Illustration"
        class="max-w-lg w-full drop-shadow-2xl mb-8"
        priority
      />
      <h2 class="text-3xl font-bold text-white mb-4">{{ illustrationTitle }}</h2>
      <p class="text-blue-100 max-w-md mx-auto text-lg leading-relaxed">
        {{ illustrationDesc }}
      </p>
    </div>
  </div>
</div>
