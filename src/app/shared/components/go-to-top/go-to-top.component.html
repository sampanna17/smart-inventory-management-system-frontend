@if (isVisible()) {
  <button
    type="button"
    (click)="scrollToTop()"
    aria-label="Go to top"
    class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 shadow-lg transition-all duration-300 hover:scale-105 hover:bg-blue-700"
  >
    <img
      ngSrc="./assets/icons/goToTop.png"
      width="532"
      height="532"
      alt="Go to top"
      class="h-6 w-6 object-contain"
    />
  </button>
}
