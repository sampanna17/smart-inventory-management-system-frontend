@if (isOpen()) {
  <div class="fixed inset-0 z-100 flex items-center justify-center p-4 sm:p-0">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>

    <!-- Modal Panel -->
    <div class="relative w-full max-w-lg transform overflow-hidden rounded-xl bg-white text-left align-middle shadow-xl transition-all flex flex-col max-h-[90vh]">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 shrink-0">
        <h3 class="text-lg font-semibold text-slate-900">
          Create New Staff
        </h3>
        <button
          type="button"
          (click)="closeModal()"
          class="rounded-md text-slate-400 hover:text-slate-500 focus:outline-none transition-colors"
        >
          <ng-icon name="heroXMark" class="text-2xl"></ng-icon>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-6 overflow-y-auto custom-scrollbar flex-1">
        <p class="text-sm text-slate-500 mb-5">
          An activation email will be sent to the staff member to set up their password.
        </p>

        <form [formGroup]="staffForm" (ngSubmit)="onSubmit()" id="create-staff-form" class="space-y-4">

          <!-- Full Name -->
          <div>
            <label for="staffFullName" class="block text-sm font-medium text-slate-700 mb-1">
              Full Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="staffFullName"
              formControlName="fullName"
              class="block w-full rounded-md border-0 py-2 px-3 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 sm:text-sm sm:leading-6"
              placeholder="e.g., John Doe"
              [ngClass]="{'ring-red-500 focus:ring-red-500': staffForm.get('fullName')?.invalid && (staffForm.get('fullName')?.dirty || staffForm.get('fullName')?.touched)}"
            />
            <app-form-error [control]="staffForm.get('fullName')" message="Full name is required."></app-form-error>
          </div>

          <!-- Email -->
          <div>
            <label for="staffEmail" class="block text-sm font-medium text-slate-700 mb-1">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="staffEmail"
              formControlName="email"
              class="block w-full rounded-md border-0 py-2 px-3 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 sm:text-sm sm:leading-6"
              placeholder="e.g., staff@example.com"
              [ngClass]="{'ring-red-500 focus:ring-red-500': staffForm.get('email')?.invalid && (staffForm.get('email')?.dirty || staffForm.get('email')?.touched)}"
            />
            <app-form-error [control]="staffForm.get('email')"></app-form-error>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="bg-slate-50 border-t border-slate-200 px-6 py-4 flex items-center justify-end gap-3 shrink-0">
        <button
          type="button"
          (click)="closeModal()"
          [disabled]="userService.isSubmitting()"
          class="inline-flex justify-center rounded-md bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 transition-colors disabled:opacity-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          form="create-staff-form"
          [disabled]="staffForm.invalid || userService.isSubmitting()"
          class="inline-flex justify-center rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (userService.isSubmitting()) {
            <span class="inline-block animate-spin mr-2">⟳</span>
          }
          Create Staff
        </button>
      </div>

    </div>
  </div>
}
