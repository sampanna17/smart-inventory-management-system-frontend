@if (isOpen() && user()) {
  <div class="fixed inset-0 z-100 flex items-center justify-center p-4 sm:p-0">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>

    <!-- Modal Panel -->
    <div class="relative w-full max-w-md transform overflow-hidden rounded-xl bg-white text-left align-middle shadow-xl transition-all flex flex-col max-h-[90vh]">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 shrink-0">
        <h3 class="text-lg font-semibold text-slate-900">
          User Details
        </h3>
        <button
          type="button"
          (click)="closeModal()"
          class="rounded-md text-slate-400 hover:text-slate-500 focus:outline-none transition-colors"
        >
          <ng-icon name="heroXMark" class="text-2xl"></ng-icon>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-6 overflow-y-auto custom-scrollbar flex-1">

        <!-- Avatar -->
        <div class="flex items-center justify-center mb-6">
          <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center">
            <span class="text-2xl font-bold text-primary">
              {{ user()!.fullName.charAt(0).toUpperCase() }}
            </span>
          </div>
        </div>

        <div class="space-y-4">
          <!-- Full Name -->
          <div class="flex items-start gap-3">
            <div class="p-2 bg-slate-100 rounded-lg shrink-0">
              <ng-icon name="heroUser" class="text-lg text-slate-500"></ng-icon>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Full Name</p>
              <p class="text-sm font-medium text-slate-900 mt-0.5">{{ user()!.fullName }}</p>
            </div>
          </div>

          <!-- Email -->
          <div class="flex items-start gap-3">
            <div class="p-2 bg-slate-100 rounded-lg shrink-0">
              <ng-icon name="heroEnvelope" class="text-lg text-slate-500"></ng-icon>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Email</p>
              <p class="text-sm font-medium text-slate-900 mt-0.5">{{ user()!.email }}</p>
            </div>
          </div>

          <!-- Role -->
          <div class="flex items-start gap-3">
            <div class="p-2 bg-slate-100 rounded-lg shrink-0">
              <ng-icon name="heroShieldCheck" class="text-lg text-slate-500"></ng-icon>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Role</p>
              <span class="inline-flex items-center mt-0.5 px-2.5 py-0.5 rounded-full text-xs font-medium"
                    [ngClass]="user()!.role === Role.ADMIN
                      ? 'bg-purple-100 text-purple-700'
                      : 'bg-blue-100 text-blue-700'">
                {{ user()!.role }}
              </span>
            </div>
          </div>

          <!-- Status -->
          <div class="flex items-start gap-3">
            <div class="p-2 bg-slate-100 rounded-lg shrink-0">
              <ng-icon name="heroSignal" class="text-lg text-slate-500"></ng-icon>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Status</p>
              <span class="inline-flex items-center mt-0.5 px-2.5 py-0.5 rounded-full text-xs font-medium"
                    [ngClass]="user()!.status === Status.ACTIVE
                      ? 'bg-green-100 text-green-700'
                      : 'bg-red-100 text-red-700'">
                {{ user()!.status }}
              </span>
            </div>
          </div>

          <!-- Created At -->
          <div class="flex items-start gap-3">
            <div class="p-2 bg-slate-100 rounded-lg shrink-0">
              <ng-icon name="heroCalendarDays" class="text-lg text-slate-500"></ng-icon>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Created</p>
              <div class="mt-0.5">
                <app-date-time [date]="user()!.createdAt" mode="full" layout="inline"></app-date-time>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="bg-slate-50 border-t border-slate-200 px-6 py-4 flex items-center justify-end shrink-0">
        <button
          type="button"
          (click)="closeModal()"
          class="inline-flex justify-center rounded-md bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 transition-colors"
        >
          Close
        </button>
      </div>

    </div>
  </div>
}
