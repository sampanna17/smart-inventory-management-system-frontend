<div class="px-4 sm:px-6 lg:px-8 py-2 w-full max-w-9xl mx-auto space-y-6">

  <!-- Page Header -->
  <app-page-header
    title="Units"
    subtitle="Manage measurement units for products"
    [roles]="Role.ADMIN"
    actionLabel="Add Unit"
    (action)="openCreateModal()"
  ></app-page-header>

  <!-- Main Content Area -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

    <!-- Filters & Search Bar -->
    <div class="p-4 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row items-center justify-between gap-4">
      <!-- Search Input -->
      <div class="relative flex-1 w-full sm:w-auto min-w-[240px]">
        <ng-icon name="heroMagnifyingGlass" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none"></ng-icon>
        <input
          type="text"
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearchInput($event)"
          placeholder="Search units by name..."
          class="w-full pl-9 pr-4 py-2 text-sm text-slate-800 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all shadow-sm min-h-[38px]"
        />
      </div>

      <!-- Sort Controls -->
      <div class="flex items-center gap-2 w-full sm:w-auto shrink-0">
        <div class="w-44">
          <app-select
            [options]="sortOptions"
            [ngModel]="sortBy()"
            (ngModelChange)="onSortChange($event)"
            placeholder="Sort by"
          ></app-select>
        </div>

        <button
          type="button"
          (click)="toggleSortOrder()"
          class="p-2 bg-white border border-slate-300 rounded-lg hover:border-slate-400 text-slate-600 hover:text-slate-900 transition-colors shadow-sm cursor-pointer min-h-[38px] flex items-center justify-center shrink-0"
          [title]="sortOrder() === 'asc' ? 'Sort Ascending' : 'Sort Descending'"
        >
          @if (sortOrder() === 'asc') {
            <ng-icon name="heroBarsArrowDown" class="text-base"></ng-icon>
          } @else {
            <ng-icon name="heroBarsArrowUp" class="text-base"></ng-icon>
          }
        </button>
      </div>
    </div>

    <!-- Loading State -->
    @if (unitService.isLoading()) {
      <div class="p-6">
        <app-skeleton-loader type="table" [rows]="5"></app-skeleton-loader>
      </div>
    } @else if (unitService.error()) {
      <!-- Error State -->
      <div class="p-6 animate-fade-in">
        <app-error-state
          [message]="unitService.error()!"
          (retry)="loadUnits()"
        ></app-error-state>
      </div>
    } @else if (units().length === 0) {
      <!-- Empty State -->
      <div class="p-6 animate-fade-in">
        <app-empty-state
          title="No units found"
          message="No units match your search. Get started by creating a new measurement unit."
          [roles]="Role.ADMIN"
          (action)="openCreateModal()"
        ></app-empty-state>
      </div>
    } @else {
      <!-- Data Table -->
      <div class="overflow-x-auto animate-fade-in">
        <table class="min-w-full divide-y divide-slate-200">
          <thead class="bg-slate-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">ID</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Unit Name</th>
              <th scope="col" *appHasRole="Role.ADMIN" class="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-slate-200">
            @for (unit of units(); track unit.unitId) {
              <tr class="hover:bg-slate-50 transition-colors">
                <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 font-mono">
                  #{{ unit.unitId }}
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <div class="text-sm text-slate-900">{{ unit.unitName }}</div>
                </td>

                <td *appHasRole="Role.ADMIN" class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                  <div class="flex justify-end gap-2">
                    <button
                      (click)="openEditModal(unit)"
                      class="p-1.5 text-slate-400 hover:text-primary hover:bg-primary/10 rounded-md transition-colors cursor-pointer"
                      title="Edit Unit">
                      <ng-icon name="heroPencilSquare" class="text-lg"></ng-icon>
                    </button>
                    <button
                      (click)="openDeleteConfirm(unit)"
                      class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors cursor-pointer"
                      title="Delete Unit">
                      <ng-icon name="heroTrash" class="text-lg"></ng-icon>
                    </button>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <!-- Angular Material MatPaginator -->
      <div class="border-t border-slate-200 bg-white">
        <mat-paginator
          [length]="totalElements()"
          [pageSize]="pageSize()"
          [pageIndex]="currentPage() - 1"
          [pageSizeOptions]="pageSizeOptions"
          [showFirstLastButtons]="true"
          (page)="onPageChange($event)"
          aria-label="Select page of units"
          class="!bg-transparent"
        >
        </mat-paginator>
      </div>
    }
  </div>
</div>

<!-- Modals -->
<app-unit-form
  [isOpen]="isFormModalOpen()"
  [unit]="selectedUnit()"
  (close)="closeFormModal()"
  (saved)="loadUnits()"
></app-unit-form>

<app-confirm-dialog
  [isOpen]="isDeleteModalOpen()"
  title="Delete Unit"
  message="Are you sure you want to delete '{{ selectedUnit()?.unitName }}'? This action cannot be undone."
  confirmLabel="Delete"
  type="danger"
  [isLoading]="unitService.isSubmitting()"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()"
></app-confirm-dialog>
