@if (isOpen()) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-0">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>

    <!-- Modal Panel -->
    <div class="relative w-full max-w-lg transform overflow-hidden rounded-xl bg-white text-left align-middle shadow-xl transition-all flex flex-col max-h-[90vh]">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 shrink-0">
        <h3 class="text-lg font-semibold text-slate-900">
          {{ isEditMode() ? 'Edit Customer' : 'Create New Customer' }}
        </h3>
        <button
          type="button"
          (click)="closeModal()"
          class="rounded-md text-slate-400 hover:text-slate-500 focus:outline-none transition-colors"
        >
          <ng-icon name="heroXMark" class="text-2xl"></ng-icon>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-6 overflow-y-auto custom-scrollbar flex-1">
        <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" id="customer-form" class="space-y-4">

          <!-- Customer Name -->
          <div>
            <label for="customerName" class="block text-sm font-medium text-slate-700 mb-1">
              Customer Name <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="customerName"
              formControlName="customerName"
              class="block w-full rounded-lg border border-slate-300 py-2 px-3 text-slate-900 bg-white shadow-sm sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all min-h-[38px]"
              placeholder="e.g., John Doe"
              [ngClass]="{'border-red-500 focus:ring-red-500/20 focus:border-red-500': isFieldInvalid('customerName')}"
            />
            @if (isFieldInvalid('customerName')) {
              <p class="mt-1.5 text-sm text-red-500">Customer name is required.</p>
            }
          </div>

          <!-- Phone -->
          <div>
            <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">
              Phone <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="phone"
              formControlName="phone"
              class="block w-full rounded-lg border border-slate-300 py-2 px-3 text-slate-900 bg-white shadow-sm sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all min-h-[38px]"
              placeholder="e.g., 9841000000"
              [ngClass]="{'border-red-500 focus:ring-red-500/20 focus:border-red-500': isFieldInvalid('phone')}"
            />
            @if (isFieldInvalid('phone')) {
              <p class="mt-1.5 text-sm text-red-500">Phone must be exactly 10 digits.</p>
            }
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
              Email <span class="text-slate-400 font-normal">(Optional)</span>
            </label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="block w-full rounded-lg border border-slate-300 py-2 px-3 text-slate-900 bg-white shadow-sm sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all min-h-[38px]"
              placeholder="e.g., john@example.com"
              [ngClass]="{'border-red-500 focus:ring-red-500/20 focus:border-red-500': isFieldInvalid('email')}"
            />
            @if (isFieldInvalid('email')) {
              <p class="mt-1.5 text-sm text-red-500">Please enter a valid email address.</p>
            }
          </div>

          <!-- Address -->
          <div>
            <label for="address" class="block text-sm font-medium text-slate-700 mb-1">
              Address <span class="text-slate-400 font-normal">(Optional)</span>
            </label>
            <textarea
              id="address"
              formControlName="address"
              rows="3"
              class="block w-full rounded-lg border border-slate-300 py-2 px-3 text-slate-900 bg-white shadow-sm sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all resize-none custom-scrollbar"
              placeholder="Enter customer address..."
            ></textarea>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="bg-slate-50 border-t border-slate-200 px-6 py-4 flex items-center justify-end gap-3 shrink-0">
        <button
          type="button"
          (click)="closeModal()"
          [disabled]="customerService.isSubmitting()"
          class="inline-flex justify-center rounded-md bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 transition-colors disabled:opacity-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          form="customer-form"
          [disabled]="customerForm.invalid || !hasChanges() || customerService.isSubmitting()"
          class="inline-flex justify-center rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (customerService.isSubmitting()) {
            <span class="inline-block animate-spin mr-2">⟳</span>
          }
          {{ isEditMode() ? 'Save Changes' : 'Create Customer' }}
        </button>
      </div>

    </div>
  </div>
}
