<app-auth-layout
  illustrationSrc="/assets/images/login-illustration.png"
  illustrationTitle="Secure Admin Access"
  illustrationDesc="Manage users, oversee inventory operations, and maintain system integrity with powerful administrator controls."
>
  <!-- Logo & Header -->
  <div class="mb-6">
    <div class="flex items-center gap-3 mb-4">
      <img
        ngSrc="/SIMS_LOGO.png"
        width="1024"
        height="1536"
        alt="SIMS Logo"
        class="w-16 object-contain"
      />
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-primary">
          SIMS
        </h1>
        <p class="text-sm text-text">
          Smart Inventory Management System
        </p>
      </div>
    </div>

    <h1 class="text-3xl font-bold text-slate-900">
      Create Admin
    </h1>
    <p class="text-slate-500 mt-2">
      Set up a new administrator account to manage the system.
    </p>
  </div>

  <form class="space-y-4" [formGroup]="adminForm" (ngSubmit)="onSubmit()">
    <!-- Full Name -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Full Name
      </label>
      <input
        type="text"
        placeholder="Enter full name"
        formControlName="fullName"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100"
        [ngClass]="{'border-red-500': fullName.invalid && fullName.touched}"
      />
      <span *ngIf="fullName.invalid && fullName.touched" class="text-xs text-red-500 mt-1 block">Name is required</span>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Email Address
      </label>
      <input
        type="email"
        placeholder="admin@example.com"
        formControlName="email"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100"
        [ngClass]="{'border-red-500': email.invalid && email.touched}"
      />
      <span *ngIf="email.invalid && email.touched" class="text-xs text-red-500 mt-1 block">Valid email is required</span>
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Password
      </label>
      <div class="relative">
        <input
          [type]="hidePassword() ? 'password' : 'text'"
          placeholder="Create a strong password"
          formControlName="password"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100 pr-12"
          [ngClass]="{'border-red-500': password.invalid && password.touched}"
        />
        <button 
          type="button" 
          (click)="togglePassword()" 
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center"
        >
          <ng-icon [name]="hidePassword() ? 'heroEye' : 'heroEyeSlash'" class="text-xl"></ng-icon>
        </button>
      </div>
      <span *ngIf="password.invalid && password.touched" class="text-xs text-red-500 mt-1 block">Password must be at least 6 characters</span>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading() || adminForm.invalid"
      class="w-full rounded-xl bg-text py-3 font-semibold text-white transition hover:bg-primary-dark disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2 mt-6"
    >
      <span *ngIf="isLoading()" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      <span>{{ isLoading() ? 'Creating...' : 'Create Admin' }}</span>
    </button>
  </form>

  <!-- Back to Login Button -->
  <div class="mt-4">
    <a 
      routerLink="/auth/login" 
      class="w-full flex items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white py-3 font-medium text-slate-700 transition hover:bg-slate-100 cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Back to Login
    </a>
  </div>
</app-auth-layout>
