<app-auth-layout
  illustrationSrc="/assets/images/login-illustration.png"
  illustrationTitle="Welcome Back"
  illustrationDesc="Sign in to continue managing your inventory."
>
  <!-- Logo -->
  <div class="mb-6">
    <div class="flex items-center gap-3 mb-4">
      <img
        ngSrc="/SIMS_LOGO.png"
        width="1024"
        height="1536"
        alt="SIMS Logo"
        class="w-16 object-contain"
      />
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-primary">
          SIMS
        </h1>
        <p class="text-sm text-text">
          Smart Inventory Management System
        </p>
      </div>
    </div>
  </div>

  <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg">
      {{ errorMessage() }}
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-2">
        Email
      </label>
      <input
        type="email"
        placeholder="Enter your email"
        formControlName="email"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100"
      />
    </div>

    <!-- Password -->
    <div>
      <div class="flex justify-between mb-2">
        <label class="text-sm font-medium text-slate-700">
          Password
        </label>
        <a routerLink="/auth/forgot-password" class="text-sm text-text hover:text-primary transition cursor-pointer">
          Forgot Password?
        </a>
      </div>

      <div class="relative">
        <input
          [type]="hidePassword() ? 'password' : 'text'"
          placeholder="Enter your password"
          formControlName="password"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100 pr-12"
        />
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center"
        >
          <ng-icon [name]="hidePassword() ? 'heroEye' : 'heroEyeSlash'" class="text-xl"></ng-icon>
        </button>
      </div>
    </div>

    <!-- Remember -->
    <div class="flex items-center justify-between">
      <label class="flex items-center gap-2">
        <input
          type="checkbox"
          formControlName="rememberMe"
          class="h-4 w-4 rounded border-slate-300 accent-primary"
        >
        <span class="text-sm text-slate-600">
          Remember me
        </span>
      </label>
    </div>

    <!-- Login -->
    <button
      type="submit"
      [disabled]="isLoading() || loginForm.invalid"
      class="w-full rounded-xl bg-text py-3 font-semibold text-white transition hover:bg-primary-dark disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2"
    >
      <span *ngIf="isLoading()" class="h-4 w-4 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
      {{ isLoading() ? 'Signing In...' : 'Sign In' }}
    </button>
  </form>

  <!-- Divider -->
  <div class="relative my-8">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-slate-200"></div>
    </div>
    <div class="relative flex justify-center">
      <span class="bg-slate-50 px-4 text-sm text-slate-400">
        OR
      </span>
    </div>
  </div>

  <!-- Google -->
  <div id="google-btn-container" class="w-full flex justify-center mt-2"></div>
</app-auth-layout>
