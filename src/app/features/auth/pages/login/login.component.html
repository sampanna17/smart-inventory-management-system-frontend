<app-auth-layout
  illustrationSrc="/assets/images/login-illustration.png"
  illustrationTitle="Welcome Back"
  illustrationDesc="Sign in to continue managing your inventory."
>
  <!-- Top Navigation -->
  <div class="flex items-center justify-between mb-8">
    <!-- Back to Home -->
    <a routerLink="/" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-slate-800 transition-colors group">
      <ng-icon name="heroArrowLeft" class="text-lg transition-transform group-hover:-translate-x-1"></ng-icon>
      <span>Back to Home</span>
    </a>

    <!-- Create Admin -->
    <a routerLink="/auth/create-admin" class="inline-flex items-center gap-2 text-sm text-primary hover:text-primary-dark transition-colors font-medium">
      <span>Create Admin</span>
      <ng-icon name="heroUserPlus" class="text-lg"></ng-icon>
    </a>
  </div>

  <!-- Logo -->
  <div class="mb-6">
    <div class="flex items-center gap-3 mb-4">
      <img
        ngSrc="/SIMS_LOGO.png"
        width="1024"
        height="1536"
        alt="SIMS Logo"
        class="w-16 object-contain"
      />
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-primary">
          SIMS
        </h1>
        <p class="text-sm text-text">
          Smart Inventory Management System
        </p>
      </div>
    </div>
  </div>

  <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Error Message -->
    @if (errorMessage()) {
      <div class="mb-4 rounded-lg bg-red-100 p-3 text-sm text-red-700">
        {{ errorMessage() }}
      </div>
    }

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-2">
        Email
      </label>
      <input
        type="email"
        placeholder="Enter your email"
        formControlName="email"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100"
      />
    </div>

    <!-- Password -->
    <div>
      <div class="flex justify-between mb-2">
        <label class="text-sm font-medium text-slate-700">
          Password
        </label>
        <a routerLink="/auth/forgot-password" class="text-sm text-text hover:text-primary transition cursor-pointer">
          Forgot Password?
        </a>
      </div>

      <div class="relative">
        <input
          [type]="hidePassword() ? 'password' : 'text'"
          placeholder="Enter your password"
          formControlName="password"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100 pr-12"
        />
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center"
        >
          <ng-icon [name]="hidePassword() ? 'heroEye' : 'heroEyeSlash'" class="text-xl"></ng-icon>
        </button>
      </div>
    </div>

    <!-- Remember -->
    <div class="flex items-center justify-between">
      <label for="rememberMe" class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          id="rememberMe"
          formControlName="rememberMe"
          class="h-4 w-4 rounded border-slate-300 accent-primary cursor-pointer"
        >
        <span class="text-sm text-slate-600">
          Remember me
        </span>
      </label>
    </div>

    <!-- Login -->
    <button
      type="submit"
      [disabled]="isLoading() || loginForm.invalid"
      class="w-full rounded-xl bg-text py-3 font-semibold text-white transition hover:bg-primary-dark disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2"
    >
      @if (isLoading()) {
        <span
          class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
        ></span>

        <span>Signing In...</span>
      } @else {
        <span>Sign In</span>
      }
    </button>
  </form>

  <!-- Divider -->
  <div class="relative my-8">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-slate-200"></div>
    </div>
    <div class="relative flex justify-center">
      <span class="bg-slate-50 px-4 text-sm text-slate-400">
        OR
      </span>
    </div>
  </div>

<!-- Google -->
<div class="relative mt-2 w-full h-12">
  <div
    class="flex h-full w-full items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white px-4 text-slate-700 font-normal transition-all duration-200 hover:bg-slate-50 hover:shadow-sm"
  >
    <img
      ngSrc="https://www.svgrepo.com/show/475656/google-color.svg"
      width="20"
      height="20"
      alt="Google Logo"
      class="h-5 w-5"
    />
    <span>Sign in with Google</span>
  </div>

  <!-- Google Button Overlay -->
  <div
    id="google-btn-container"
    class="absolute inset-0 h-full w-full"
    style="opacity: 0.01;"
  ></div>
</div>
</app-auth-layout>
