<app-auth-layout
  illustrationSrc="/assets/images/login-illustration.png"
  illustrationTitle="Create New Password"
  illustrationDesc="Secure your account with a strong new password to continue managing the system."
>
  <!-- Logo & Header -->
  <div class="mb-6">
    <div class="flex items-center gap-3 mb-4">
      <img
        ngSrc="/SIMS_LOGO.png"
        width="1024"
        height="1536"
        alt="SIMS Logo"
        class="w-16 object-contain"
      />
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-primary">
          SIMS
        </h1>
        <p class="text-sm text-text">
          Smart Inventory Management System
        </p>
      </div>
    </div>

    <h1 class="text-3xl font-bold text-slate-900">
      Reset Password
    </h1>
    <p class="text-slate-500 mt-2">
      Enter your new password below.
    </p>
  </div>

  <form class="space-y-4" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <!-- Error Message -->
    <div *ngIf="errorMessage()" class="mb-4 rounded-lg bg-red-100 p-3 text-sm text-red-700">
      {{ errorMessage() }}
    </div>

    <!-- New Password -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        New Password
      </label>
      <div class="relative">
        <input
          [type]="hidePassword() ? 'password' : 'text'"
          placeholder="Create a strong password"
          formControlName="newPassword"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100 pr-12"
          [ngClass]="{'border-red-500': newPassword.invalid && newPassword.touched}"
        />
        <button 
          type="button" 
          (click)="togglePassword()" 
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center"
        >
          <ng-icon [name]="hidePassword() ? 'heroEye' : 'heroEyeSlash'" class="text-xl"></ng-icon>
        </button>
      </div>
      <span *ngIf="newPassword.invalid && newPassword.touched" class="text-xs text-red-500 mt-1 block">Password must be at least 6 characters</span>
    </div>

    <!-- Confirm Password -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Confirm Password
      </label>
      <div class="relative">
        <input
          [type]="hideConfirmPassword() ? 'password' : 'text'"
          placeholder="Confirm your new password"
          formControlName="confirmPassword"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:ring-4 focus:ring-blue-100 pr-12"
          [ngClass]="{'border-red-500': (confirmPassword.invalid || resetForm.hasError('mismatch')) && confirmPassword.touched}"
        />
        <button 
          type="button" 
          (click)="toggleConfirmPassword()" 
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none flex items-center justify-center"
        >
          <ng-icon [name]="hideConfirmPassword() ? 'heroEye' : 'heroEyeSlash'" class="text-xl"></ng-icon>
        </button>
      </div>
      <span *ngIf="resetForm.hasError('mismatch') && confirmPassword.touched" class="text-xs text-red-500 mt-1 block">Passwords do not match</span>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="isLoading() || resetForm.invalid"
      class="w-full rounded-xl bg-text py-3 font-semibold text-white transition hover:bg-primary-dark disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center gap-2 mt-6"
    >
      <span *ngIf="isLoading()" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
      <span>{{ isLoading() ? 'Resetting...' : 'Reset Password' }}</span>
    </button>
  </form>

  <!-- Back to Login Button -->
  <div class="mt-4">
    <a 
      routerLink="/auth/login" 
      class="w-full flex items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white py-3 font-medium text-slate-700 transition hover:bg-slate-100 cursor-pointer"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Back to Login
    </a>
  </div>
</app-auth-layout>
