<div
  [routerLink]="route() || null"
  class="group relative bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs transition-all duration-200 flex flex-col justify-between"
  [ngClass]="{
    'hover:border-slate-300 hover:shadow-md cursor-pointer': !!route(),
    'border-l-4 border-l-danger': variant() === 'danger' && alert(),
    'border-l-4 border-l-warning': variant() === 'warning' && alert()
  }"
>
  <div>
    <!-- Top Row: Icon & Badge/Link -->
    <div class="flex items-start justify-between gap-3 mb-4">
      <div
        class="flex items-center justify-center w-12 h-12 rounded-xl transition-transform group-hover:scale-105"
        [ngClass]="{
          'bg-primary/10 text-primary': variant() === 'primary',
          'bg-emerald-50 text-emerald-600': variant() === 'success',
          'bg-amber-50 text-amber-600': variant() === 'warning',
          'bg-rose-50 text-rose-600': variant() === 'danger',
          'bg-blue-50 text-blue-600': variant() === 'info',
          'bg-slate-100 text-slate-700': variant() === 'slate'
        }"
      >
        <ng-icon [name]="icon()" class="text-2xl"></ng-icon>
      </div>

      @if (badge()) {
        <span
          class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold"
          [ngClass]="{
            'bg-rose-100 text-rose-700': badgeType() === 'danger',
            'bg-amber-100 text-amber-700': badgeType() === 'warning',
            'bg-emerald-100 text-emerald-700': badgeType() === 'success',
            'bg-blue-100 text-blue-700': badgeType() === 'info',
            'bg-slate-100 text-slate-700': badgeType() === 'neutral'
          }"
        >
          {{ badge() }}
        </span>
      } @else if (route()) {
        <span class="text-slate-300 group-hover:text-primary transition-colors text-sm font-medium flex items-center gap-0.5">
          <ng-icon name="heroArrowRight" class="text-base"></ng-icon>
        </span>
      }
    </div>

    <!-- Metric Value -->
    <div class="space-y-1">
      <p class="text-xs font-medium uppercase tracking-wider text-slate-500">
        {{ title() }}
      </p>

      <div class="flex items-baseline gap-2">
        <h3 class="text-2xl sm:text-3xl font-extrabold text-heading tracking-tight">
          @if (isCurrency()) {
            {{ value() | nprCurrency:true:'NPR':2 }}
          } @else {
            {{ value() | number }}
          }
        </h3>
      </div>
    </div>
  </div>

  <!-- Subtitle / Meta footer -->
  @if (subtitle()) {
    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <span class="truncate">{{ subtitle() }}</span>
      @if (alert()) {
        <span class="font-semibold text-rose-600 shrink-0 flex items-center gap-1">
          <ng-icon name="heroExclamationCircle" class="text-sm"></ng-icon>
          Action required
        </span>
      }
    </div>
  }
</div>
